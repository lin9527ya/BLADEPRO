name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ① Go：vet + 全量测试。测试跑在真实 Postgres 上（隔离库 bladepro_test）；多包共享
  #    同一个库，必须 -p 1 串行（默认包级并行会相互污染出假失败）。
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bladepro
          POSTGRES_PASSWORD: bladepro
          POSTGRES_DB: bladepro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bladepro -d bladepro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BLADEPRO_PG_DSN: postgres://bladepro:bladepro@127.0.0.1:5432/bladepro_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      # 只查已跟踪的 .go 文件（git ls-files），避免走进 web/node_modules 之类的未跟踪目录。
      - name: gofmt
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 对齐："
            echo "$unformatted"
            exit 1
          fi
      # 版本钉死：staticcheck 新版可能加检查项，用 @latest 会让 CI 某天无声变红。
      # 检查项在仓库根的 staticcheck.conf（关 ST 风格家族），个别定点抑制用行内 //lint:ignore。
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
      # -race 抓并发缺陷：本仓的 agent 包有 9 个包级可变函数变量（由 server 启动时赋值、
      # 无锁无 Once），测试里也有手工改它们再回滚的写法——只要将来某个测试同时用上
      # t.Parallel()，就会变成偶发红而无人知晓。实测当前全量在 -race 下 0 告警（agent 包也
      # 绿），先立住这条护栏。
      # CGO_ENABLED 显式声明：-race 需要 cgo，CI 镜像自带 gcc（默认值本会是 1），但写死免得
      # 将来 runner 变了默认值、-race 静默失效或直接报错。
      # 代价：本机实测全量 57s → 107s（1.9×）。
      - name: go test（串行，count=1 防缓存；-race 抓并发缺陷）
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -p 1 ./...
      # 跨平台编译：此前**只有 release 工作流**跨平台构建，而它只在打 tag 时跑——于是平台相关的
      # 构建断裂能藏一整个功能周期。2026-10-14 的 v0.4.1 就是这么翻车的：P24 把限额实现放进
      # 带 `//go:build !windows` 的文件、别处却无条件引用，Windows 编译失败 → matrix fail-fast
      # 连坐取消其余四个平台 → release job 被 needs 跳过 → tag 有了、Release 没建成。
      # 这里每次 push 就把五个发布目标各编一遍。CGO_ENABLED=0：交叉编译不接 cgo。
      - name: 跨平台构建（与 release 同目标）
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "— $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./... || exit 1
          done

  # ② Web + 端到端构建：前端静态导出（含类型检查）后按发布口径构建内嵌二进制的
  #    embedui 版本——把"发布时才炸"的问题提前到 push 上。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # 纯逻辑单测（node:test，跑在 src/lib/*.test.mjs 上）。此前这两个文件从未被
      # 任何流程执行过——写了等于没写。放在 build 之前，让失败早暴露。
      - name: 前端单测
        run: npm test
        working-directory: web
      - name: 前端静态导出
        run: npm run build:static
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 内嵌前端构建二进制（发布同款）
        run: |
          # dist 是构建产物(gitignored)：全新检出里 server/webui/ 不存在，先建再同步。
          mkdir -p server/webui/dist
          rsync -a --delete web/out/ server/webui/dist/
          CGO_ENABLED=0 go build -tags embedui -trimpath -o /tmp/bladepro ./cmd/bladepro
