# 反向代理示例（方案 B：公网直连 + Cloudflare 代理）。
#
# 前提：BLADEPRO 仍保持默认监听 127.0.0.1:8787（**不要**改成对外），
#       并且防火墙只放行 Cloudflare 段访问 443（deploy/ufw-cloudflare.sh）。
#
# 证书：用 **Cloudflare Origin Certificate**（CF 后台签发，15 年，**不进证书透明日志**）。
#       别用 Let's Encrypt：它签的证书会进 CT 日志 → 域名与 IP 被 Censys/Shodan 一类引擎收录，
#       那是刚性的公开泄露，改界面、改端口都救不回来。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 只信 Cloudflare 的真实来源：段要用下面的命令生成（会变，别抄死）。
    #   curl -s https://www.cloudflare.com/ips-v4 | sed 's/^/set_real_ip_from /; s/$/;/'
    #   curl -s https://www.cloudflare.com/ips-v6 | sed 's/^/set_real_ip_from /; s/$/;/'
    # include /etc/nginx/cloudflare-ips.conf;   ← 上面两条命令输出存成这个文件
    real_ip_header CF-Connecting-IP;

    # 只接受经 Cloudflare 来的请求：直连源站 IP 的一律拒（扫描器通常不带这个头）。
    # 注意这是**第二道**，第一道是防火墙——两者都要有。
    if ($http_cf_connecting_ip = "") { return 444; }

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # BLADEPRO 的活动流 / 日志流 / 通知是 SSE 长连接：关缓冲、放长读超时，
        # 否则表现为"活动流跑一会儿就断"。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查可以只对本机/CF 开；BLADEPRO 的 /api/health 已不再自报家门（只回 {"ok":true}）。
    location = /api/health {
        proxy_pass http://127.0.0.1:8787;
        access_log off;
    }
}

# 裸 HTTP 不响应内容（减少扫描面）：CF 侧设 Always Use HTTPS，这里直接掐掉。
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 444;
}
