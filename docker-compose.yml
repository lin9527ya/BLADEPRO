services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bladepro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bladepro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bladepro} -d ${POSTGRES_DB:-bladepro}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bladepro:
    # 本地构建（不再引用任何外部镜像）：先 ./build.sh 产出 dist/<arch>/bladepro，再 compose up --build。
    build: .
    image: bladepro:${BLADEPRO_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BLADEPRO_PG_DSN: postgres://${POSTGRES_USER:-bladepro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bladepro}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BLADEPRO_LLM_PROVIDER: ${BLADEPRO_LLM_PROVIDER:-}
      BLADEPRO_LLM_MODEL: ${BLADEPRO_LLM_MODEL:-}
      BLADEPRO_LLM_BASE_URL: ${BLADEPRO_LLM_BASE_URL:-}
      BLADEPRO_LLM_PROXY: ${BLADEPRO_LLM_PROXY:-}
    ports:
      # 只映射到宿主 loopback（P42）：公网访问请走 Cloudflare Tunnel 或 SSH 隧道（见 deploy/）。
      # 真要直连公网，也请配合防火墙只放行 Cloudflare 来源段，别裸奔。
      - "127.0.0.1:9898:9898"
      - "127.0.0.1:9899:9899"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
